
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090611">
  <title>LEAKA — Connect Freely</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div id="auth">
    <div class="auth-container">
      <h1>LEAKA</h1>
      <p>Connect freely. Express yourself.</p>

      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button id="loginBtn" type="button" onclick="login()">Log In</button>
      <button id="signupBtn" type="button" onclick="signUp()">Create Account</button>

      <p id="authMessage"></p>
    </div>
  </div>

  <div id="appContent" style="display:none;">

    <header>
      <h2>LEAKA</h2>
    </header>

    <main>
      <section id="feed" class="page">
        <h2>Home</h2>
        <div id="stories"></div>
        <div id="posts"></div>
      </section>

      <section id="searchPage" class="page" style="display:none;">
        <h2>Discover</h2>
        <input id="searchInput" placeholder="Search users...">
        <div id="searchResults"></div>
      </section>

      <section id="profile" class="page" style="display:none;">
        <div id="profileInfo"></div>
        <div id="profilePosts"></div>
      </section>

      <section id="notifications" class="page" style="display:none;">
        <h2>Notifications</h2>
        <div id="notificationList"></div>
      </section>

      <section id="settings" class="page" style="display:none;">
        <h2>Settings</h2>
        <button type="button" onclick="logout()">Log Out</button>
      </section>
    </main>

    <nav id="bottomNav">
      <button type="button" onclick="showPage('feed')">Home</button>
      <button type="button" onclick="showPage('searchPage')">Discover</button>
      <button type="button" onclick="showPage('profile')">Profile</button>
      <button type="button" onclick="showPage('notifications')">Notifications</button>
      <button type="button" onclick="showPage('settings')">Settings</button>
    </nav>

  </div>

  <script src="script.js"></script>

</body>
</html>
